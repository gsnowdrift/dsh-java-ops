name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing exchanges this for a short-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1, older runners ship 10.x
      - run: npm install -g npm@latest

      - run: npm ci

      - run: node --check lib/index.js
      - run: node --check lib/client.js

      - name: package contents
        run: npm pack --dry-run

      - name: publish
        # A prerelease version (0.3.0-rc.1) goes to its own dist-tag, never `latest`.
        run: |
          TAG=$(node -p "const p=require('./package.json').version.split('-')[1]; p ? p.split('.')[0] : 'latest'")
          npm publish --access public --tag "$TAG"
